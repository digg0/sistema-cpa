version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./data/cpa.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=http://localhost,http://127.0.0.1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend